<div class="article-card">
  <div class="card-image"
       style="background-image: url({{ staticPathForImages + article.image }})"></div>
  <div class="card-title">{{ article.title }}</div>
  <div class="card-description">{{ article.description }}</div>
  <div class="card-footer">
    <a href="#" class="link-to-article">Читать дальше</a>
  </div>
  <div class="category-absolute-label">{{ article.category }}</div>
</div>
