<section class="signup" [formGroup]="signupForm">
  <div class="container">
    <div class="auth-form">
      <div class="auth-title">
        Регистрация на сайте
      </div>
      <div class="auth-inputs">
        <div class="auth-input">
          <input type="text" class="input"
                 [ngStyle]="{'border-color': isFieldInvalid('name') ? 'red' : ''}"
                 placeholder="Ваше имя" formControlName="name">
          <div class="error-message">
            <span *ngIf="isFieldInvalid('name', InputErrorType.Required)">Имя обязательно</span>
            <span *ngIf="isFieldInvalid('name', InputErrorType.Pattern)">Имя и фамилию пишут с заглавной буквы</span>
          </div>
        </div>
        <div class="auth-input">
          <input type="email" class="input"
                 [ngStyle]="{'border-color': isFieldInvalid('email') ? 'red' : ''}"
                 placeholder="Электронная почта" formControlName="email">
          <div class="error-message">
            <span *ngIf="isFieldInvalid('email', InputErrorType.Required)">Email обязателен</span>
            <span *ngIf="isFieldInvalid('email', InputErrorType.Email)">Введите корректный Email</span>
          </div>
        </div>
        <div class="auth-input">
          <input type="password" class="input"
                 [ngStyle]="{'border-color': isFieldInvalid('password') ? 'red' : ''}"
                 placeholder="Пароль" formControlName="password">
          <div class="error-message">
            <span *ngIf="isFieldInvalid('password', InputErrorType.Required)">Пароль обязателен</span>
            <span *ngIf="isFieldInvalid('password', InputErrorType.MinLength)">Минимум 8 символов</span>
            <br
              *ngIf="isFieldInvalid('password', InputErrorType.MinLength) && isFieldInvalid('password', InputErrorType.Pattern)">
            <span *ngIf="isFieldInvalid('password', InputErrorType.Pattern)">Нужна 1 заглавная буква и 1 цифра</span>
          </div>
        </div>
        <div class="auth-checkbox">
          <input type="checkbox" id="agree-checkbox" formControlName="agree">
          <label for="agree-checkbox">Я принимаю
            <a routerLink="/terms" fragment="user-agreement" target="_blank" rel="noopener noreferrer">
              условия пользовательского соглашения</a>
            и даю
            <a routerLink="/terms" fragment="personal-data-processing" target="_blank" rel="noopener noreferrer">
              согласие на обработку персональных данных</a>.
          </label>
        </div>
        <div class="error-message">
          <span *ngIf="isFieldInvalid('agree', InputErrorType.Required)">Для продолжения нужно принять Условия</span>
        </div>
      </div>
      <div class="auth-button">
        <button class="button"
                [ngStyle]="{'background': signupForm.invalid && (signupForm.touched || signupForm.dirty) ? '#91acc6' : ''}"
                (click)="signup()">
          Зарегистрироваться
        </button>
      </div>
      <div class="auth-link">
        Уже есть аккаунт? <a routerLink="/login">Войдите</a>
      </div>
    </div>
    <div class="page-image">
      <img src="/assets/images/pages/someone-draws-diagrams.png" alt="Someone draws diagrams">
    </div>
  </div>
</section>
