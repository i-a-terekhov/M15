<section class="login">
  <div class="container">
    <div class="auth-form">
      <div class="auth-title">
        Войти в личный кабинет
      </div>
      <div class="auth-inputs">
        <div class="auth-input"><input type="email" class="input" placeholder="Электронная почта"></div>
        <div class="auth-input"><input type="password" class="input" placeholder="Пароль"></div>
        <div class="auth-checkbox">
          <input type="checkbox" id="remember-me-checkbox">
          <label for="remember-me-checkbox">Запомнить меня</label>
        </div>
      </div>
      <div class="auth-button">
        <button class="button">Войти</button>
      </div>
      <div class="auth-link">
        Нет аккаунта? <a routerLink="/signup">Пройдите регистрацию</a>
      </div>
    </div>
    <div class="page-image">
      <img src="/assets/images/pages/happy-woman.png" alt="Someone draws diagrams">
    </div>
  </div>
</section>
