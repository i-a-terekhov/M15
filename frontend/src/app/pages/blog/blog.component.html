<section class="blog">
  <div class="container">
    <div class="chapter chapter-blog">
      <div class="chapter-title chapter-title--blog">Блог</div>

      <div class="chapter-filter-bar">
        <div class="labels-area">
          <div class="filter-bar-label">
            <span class="label-name">Дизайн</span>
            <svg width="16" height="16">
              <use href="../../assets/icons/arrows.svg#label-cross"></use>
            </svg>
          </div>
          <div class="filter-bar-label">
            <span class="label-name">Дизайн</span>
            <svg width="16" height="16">
              <use href="../../assets/icons/arrows.svg#label-cross"></use>
            </svg>
          </div>
          <div class="filter-bar-label">
            <span class="label-name">Дизайн</span>
            <svg width="16" height="16">
              <use href="../../assets/icons/arrows.svg#label-cross"></use>
            </svg>
          </div>
        </div>
        <div class="drop-down-area">
          <div class="drop-down-menu">
            <span class="drop-down-title">Фильтр</span>
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M10 14C9.41668 14 8.83335 13.775 8.39168 13.3334L2.95835 7.90003C2.71668 7.65837 2.71668 7.25837 2.95835 7.0167C3.20002 6.77503 3.60002 6.77503 3.84168 7.0167L9.27502 12.45C9.67502 12.85 10.325 12.85 10.725 12.45L16.1583 7.0167C16.4 6.77503 16.8 6.77503 17.0417 7.0167C17.2833 7.25837 17.2833 7.65837 17.0417 7.90003L11.6083 13.3334C11.1667 13.775 10.5833 14 10 14Z"
                fill="#071739"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="pseudo-carousel">
        <article-card [article]="article" *ngFor="let article of currentArticlesData"></article-card>
      </div>

      <div class="pagination">

        <div class="pg-pseudo-btn pg-button-prev" *ngIf="!ifPrevArrowAllowed">
          <svg width="100%" height="100%">
            <use href="../../assets/icons/arrows.svg#pagination-arrow-left-disabled"></use>
          </svg>
        </div>
        <button class="pg-btn pg-button-prev" *ngIf="ifPrevArrowAllowed">
          <svg width="100%" height="100%">
            <use href="../../assets/icons/arrows.svg#pagination-arrow-left-active"></use>
          </svg>
        </button>

        <button class="pg-btn pg-button-digit" [class.active]="(page + 1 === currentPage)"
                *ngFor="let i of [].constructor(totalAmountOfPages + 3); let page = index;">
          {{ page + 1 }}
        </button>

        <div class="pg-pseudo-btn pg-button-prev" *ngIf="!ifNextArrowAllowed">
          <svg width="100%" height="100%">
            <use href="../../assets/icons/arrows.svg#pagination-arrow-right-disabled"></use>
          </svg>
        </div>
        <button class="pg-btn pg-button-prev" *ngIf="ifNextArrowAllowed">
          <svg width="100%" height="100%">
            <use href="../../assets/icons/arrows.svg#pagination-arrow-right-active"></use>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
